<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4c195c"><title>Cake Photo Gallery | Jai Slay Cakes</title><style>*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;color:#3b194a;background:linear-gradient(160deg,#fdf2f8,#f0e1ff 50%,#fff8f4);min-height:100vh}header{text-align:center;padding:28px 16px 16px}h1{font-size:clamp(32px,7vw,56px);margin:12px 0;color:#642c82}p{margin:8px}a{color:#682885}.back,.order{display:inline-block;padding:13px 20px;border-radius:40px;background:#632c81;color:white;text-decoration:none;font-family:Arial,sans-serif;font-weight:bold}.order{background:#923b92}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:16px;max-width:900px;margin:auto}.tile{border:3px solid #fff;padding:0;background:white;border-radius:18px;overflow:hidden;box-shadow:0 4px 18px #54276530;cursor:pointer;aspect-ratio:1}.tile img{width:100%;height:100%;object-fit:cover;display:block}@media(min-width:680px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}}footer{text-align:center;padding:15px 10px 40px}dialog{border:0;padding:0;background:#1c0929;color:white;width:min(96vw,1000px);max-width:1000px;max-height:96vh;border-radius:14px;overflow:hidden}dialog::backdrop{background:#100318df}.viewer{display:flex;align-items:center;justify-content:center;position:relative;min-height:220px}.viewer img{max-width:100%;max-height:85vh;object-fit:contain;display:block}.nav,.close{position:absolute;border:0;border-radius:30px;background:#401b58e8;color:white;font-size:25px;padding:10px 16px;cursor:pointer}.prev{left:6px}.next{right:6px}.close{right:8px;top:8px;font-size:18px}</style></head><body><header><a class="back" href="index.html">← Back to homepage</a><h1>THE SLAY COLLECTION 💜</h1><p>Custom cakes, made in Mississippi. Tap any photo to view.</p></header><section class="grid"><button class="tile" data-i="0" aria-label="View cake photo 1"><img src="photos/cake-01.jpg" alt="Jai Slay Cakes custom cake photo 1" loading="lazy"></button>
<button class="tile" data-i="1" aria-label="View cake photo 2"><img src="photos/cake-02.jpg" alt="Jai Slay Cakes custom cake photo 2" loading="lazy"></button>
<button class="tile" data-i="2" aria-label="View cake photo 3"><img src="photos/cake-03.jpg" alt="Jai Slay Cakes custom cake photo 3" loading="lazy"></button>
<button class="tile" data-i="3" aria-label="View cake photo 4"><img src="photos/cake-04.jpg" alt="Jai Slay Cakes custom cake photo 4" loading="lazy"></button>
<button class="tile" data-i="4" aria-label="View cake photo 5"><img src="photos/cake-05.jpg" alt="Jai Slay Cakes custom cake photo 5" loading="lazy"></button>
<button class="tile" data-i="5" aria-label="View cake photo 6"><img src="photos/cake-06.jpg" alt="Jai Slay Cakes custom cake photo 6" loading="lazy"></button>
<button class="tile" data-i="6" aria-label="View cake photo 7"><img src="photos/cake-07.jpg" alt="Jai Slay Cakes custom cake photo 7" loading="lazy"></button>
<button class="tile" data-i="7" aria-label="View cake photo 8"><img src="photos/cake-08.jpg" alt="Jai Slay Cakes custom cake photo 8" loading="lazy"></button>
<button class="tile" data-i="8" aria-label="View cake photo 9"><img src="photos/cake-09.jpg" alt="Jai Slay Cakes custom cake photo 9" loading="lazy"></button>
<button class="tile" data-i="9" aria-label="View cake photo 10"><img src="photos/cake-10.jpg" alt="Jai Slay Cakes custom cake photo 10" loading="lazy"></button></section><footer><a class="order" href="https://forms.gle/MkHJxiYnkAYwRhoj9" target="_blank" rel="noopener noreferrer">Order your custom cake →</a></footer><dialog id="lightbox" aria-label="Enlarged cake photo"><div class="viewer"><img id="large" alt="Enlarged cake photo"><button class="nav prev" id="prev" aria-label="Previous photo">‹</button><button class="nav next" id="next" aria-label="Next photo">›</button><button class="close" id="close" aria-label="Close gallery">×</button></div></dialog><script>const files=Array.from({length:10},(_,i)=>'photos/cake-'+String(i+1).padStart(2,'0')+'.jpg');let index=0;const d=document.getElementById('lightbox'),img=document.getElementById('large');function show(i){index=(i+files.length)%files.length;img.src=files[index];img.alt='Custom cake photo '+(index+1)}document.querySelectorAll('.tile').forEach(b=>b.addEventListener('click',()=>{show(Number(b.dataset.i));d.showModal()}));document.getElementById('prev').onclick=()=>show(index-1);document.getElementById('next').onclick=()=>show(index+1);document.getElementById('close').onclick=()=>d.close();document.addEventListener('keydown',e=>{if(!d.open)return;if(e.key==='ArrowLeft')show(index-1);if(e.key==='ArrowRight')show(index+1)});let start=0;img.addEventListener('touchstart',e=>start=e.touches[0].clientX,{passive:true});img.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-start;if(Math.abs(dx)>45)show(index+(dx<0?1:-1))},{passive:true});</script></body></html>
